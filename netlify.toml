[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# PDF + Notion podem levar alguns segundos na primeira carga
[functions]
  node_bundler = "esbuild"

# Dia 1 de cada mês, 11:00 UTC — relatório do mês anterior
[functions."relatorio-mensal"]
  schedule = "0 11 1 * *"
